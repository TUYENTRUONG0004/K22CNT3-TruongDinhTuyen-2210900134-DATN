<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Địa chỉ giao hàng – TOYWORLD Admin</title>
  <link rel="stylesheet" href="../admin/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">TOYWORLD</div>
      <nav class="nav">
        <a class="nav-item" href="tongquan.html"><i class="fas fa-home"></i> Tổng quan</a>
        <a class="nav-item" href="sanpham.html"><i class="fas fa-cube"></i> Sản phẩm</a>
        <a class="nav-item" href="danhmuc.html"><i class="fas fa-tags"></i> Danh mục</a>
        <a class="nav-item" href="khohang.html"><i class="fas fa-box"></i> Kho hàng</a>
        <a class="nav-item" href="khuyenmai.html"><i class="fas fa-gift"></i> Khuyến mãi</a>
        <a class="nav-item" href="donhang.html"><i class="fas fa-shopping-cart"></i> Đơn hàng</a>
        <a class="nav-item" href="nguoidung.html"><i class="fas fa-users"></i> Người dùng</a>
        <a class="nav-item active" href="diachigiaohang.html"><i class="fas fa-map-marker-alt"></i> Địa chỉ giao hàng</a>
      </nav>
    </aside>

    <main class="main">
      <h1 class="page-title">Quản lý Địa chỉ Giao hàng</h1>

      <div class="panel">
        <h3>Danh sách địa chỉ giao hàng</h3>
        <table id="addressTable" class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Khách hàng</th>
              <th>Tên người nhận</th>
              <th>Số điện thoại</th>
              <th>Địa chỉ</th>
              <th>Mặc định</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <!-- JS sẽ render dữ liệu -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal sửa địa chỉ -->
  <div id="editModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3>Sửa địa chỉ giao hàng</h3>
      <form id="editAddressForm">
        <input type="hidden" id="editAddressId">

        <div class="form-row">
          <label>Tên người nhận</label>
          <input id="editTenNguoiNhan" required>
        </div>

        <div class="form-row">
          <label>Số điện thoại</label>
          <input id="editSoDienThoai" required>
        </div>

        <div class="form-row">
          <label>Địa chỉ chi tiết</label>
          <textarea id="editDiaChi" rows="3" required></textarea>
        </div>

        <div class="form-row">
          <label>Đặt làm mặc định</label>
          <input type="checkbox" id="editMacDinh">
        </div>

        <button type="submit" class="btn primary">Cập nhật địa chỉ</button>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script src="../admin/js/admin.js"></script>
  <script src="../admin/js/diachigiaohang.js"></script>
</body>
</html>
